# =====================================================================
#  Discount agent settings
#  You can edit this file directly on github.com (click the pencil icon).
#  Lines starting with # are comments and are ignored.
# =====================================================================

# Seconds to wait between web requests, to be polite to the shops.
request_delay_seconds: 1.5

# ---------------------------------------------------------------------
# WHAT to watch.
# A product listing matches when ALL the patterns under "match" are found
# in its name/variant (case doesn't matter, "|" means "or").
# "exclude" removes listings that contain any of those words.
# "group" connects products to the shops below.
# ---------------------------------------------------------------------
products:
  - id: ps-carbon-pan
    name: Professional Secrets carbon steel pan
    group: pans
    match:
      - "kolst[aå]l|carbon|stekpanna|panna|wok|\\bpan\\b|skillet"
    exclude: "olja|oil|\\block\\b|\\blid\\b|grytlapp|handtagsskydd|sleeve|presentkort|gift ?card|bok\\b"

  - id: bergs-copenhagen-green-21
    name: Bergs Potter Copenhagen green 21 cm
    group: bergs
    match: ["copenhagen|k[øoö]benhavn|k[öo]penhamn", "gr[øöo]n|green", "(?<![\\d.,])21(?![\\d.,])"]

  - id: bergs-copenhagen-green-25
    name: Bergs Potter Copenhagen green 25 cm
    group: bergs
    match: ["copenhagen|k[øoö]benhavn|k[öo]penhamn", "gr[øöo]n|green", "(?<![\\d.,])25(?![\\d.,])"]

  - id: bergs-copenhagen-yellow-21
    name: Bergs Potter Copenhagen yellow 21 cm
    group: bergs
    match: ["copenhagen|k[øoö]benhavn|k[öo]penhamn", "\\bgul\\b|yellow", "(?<![\\d.,])21(?![\\d.,])"]

  - id: bergs-copenhagen-yellow-25
    name: Bergs Potter Copenhagen yellow 25 cm
    group: bergs
    match: ["copenhagen|k[øoö]benhavn|k[öo]penhamn", "\\bgul\\b|yellow", "(?<![\\d.,])25(?![\\d.,])"]

# ---------------------------------------------------------------------
# WHERE to look.
#   type: auto   -> works out by itself if the shop is Shopify, WooCommerce
#                   or a normal web page (recommended)
#   pages        -> pages to open: product lists, sale pages, search results.
#                   Product links on them are followed automatically.
#   promo_pages  -> extra pages only scanned for discount codes / campaigns
#   require      -> listing must contain this (used for big shops that sell
#                   many brands)
#   optional     -> true = don't warn if nothing is found there
#   enabled      -> false = skip this shop
# ---------------------------------------------------------------------
sources:
  # --- The brands' own shops ------------------------------------------
  # Professional Secrets' web shop runs on Shopify at shop-ps.se.
  - id: ps-shop
    name: Professional Secrets (shop-ps.se)
    type: shopify
    base_url: https://shop-ps.se
    currency: SEK
    groups: [pans]
    optional: true
    promo_pages:
      - https://shop-ps.se/collections/bastsaljare

  # Their main site professionalsecrets.se shows prices as text ("NU 449kr (ord 749kr)").
  - id: professionalsecrets
    name: Professional Secrets
    type: html
    text_prices: true
    currency: SEK
    base_url: https://www.professionalsecrets.se
    groups: [pans]
    pages:
      - https://www.professionalsecrets.se/butik-stekpannor.html
      - https://www.professionalsecrets.se/

  # bergspotter.com shows a "Checking your browser" page to automated visitors,
  # so it usually can't be read. Kept in case that changes; the retailers below
  # cover the Copenhagen pots.
  - id: bergspotter
    name: Bergs Potter
    type: auto
    optional: true
    base_url: https://bergspotter.com
    groups: [bergs]

  # --- Price comparison ------------------------------------------------
  # Prisjakt also blocks automated visitors ("Just a moment..."). If that
  # changes it will be used automatically.
  - id: prisjakt
    name: Prisjakt (lowest price)
    type: html
    optional: true
    groups: [pans, bergs]
    require: "bergs|professional ?secrets"
    link_pattern: "produkt\\.php\\?p=\\d+"
    pages:
      - https://www.prisjakt.nu/search?search=bergs%20potter%20copenhagen
      - https://www.prisjakt.nu/search?search=professional%20secrets%20kolst%C3%A5l

  # --- Retailers selling Bergs Potter Copenhagen ----------------------
  # Shops call the pot "Copenhagen", "Köpenhamn" or "Københavner".
  - id: royaldesign
    name: Royal Design
    type: html
    optional: true
    groups: [bergs]
    pages:
      - https://royaldesign.se/serie/bergs-potter-copenhagen
      - https://royaldesign.se/bergs-potter
      - https://royaldesign.se/search?q=bergs+potter+copenhagen

  - id: nordicnest
    name: Nordic Nest
    type: html
    optional: true
    groups: [bergs]
    pages:
      - https://www.nordicnest.se/varumarken/bergs-potter/
      - https://www.nordicnest.dk/brands/bergs-potter/

  - id: finnishdesignshop
    name: Finnish Design Shop (Danish prices)
    type: html
    optional: true
    groups: [bergs]
    pages:
      - https://www.finnishdesignshop.com/en-dk/product/kobenhavner-flowerpot-with-saucer-glazed-emerald-green
      - https://www.finnishdesignshop.com/en-dk/product/kobenhavner-flowerpot-with-saucer-glazed-amber-yellow

  - id: illums
    name: Illums Bolighus
    type: html
    optional: true
    groups: [bergs]
    require: "bergs"
    pages:
      - https://www.illumsbolighus.dk/search?q=bergs+potter+copenhagen
